[project]
name = "fantasy-football-2025"
version = "0.1.0"
description = "A data-driven approach to fantasy football analysis and decision making for the 2025 season"
authors = [
    {name = "Michael Turchin", email = "miturchin@protonmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["fantasy-football", "sports-analytics", "data-science", "nfl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    # Data manipulation and analysis
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    
    # Machine learning
    "scikit-learn>=1.3.0",
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",
    
    # Statistical analysis
    "statsmodels>=0.14.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.7.0",
    
    # Data visualization
    "plotly>=5.15.0",
    "bokeh>=3.2.0",
    
    # Web scraping and APIs
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "selenium>=4.10.0",
    
    # Database and storage
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "alembic>=1.12.0",
    
    # Sports data specific
    "nfl-data-py>=0.3.0",
    "sleeper-api-wrapper>=1.0.0",
    
    # Optimization
    "pulp>=2.7.0",
    "cvxpy>=1.3.0",
    
    # AWS and SageMaker
    "boto3>=1.34.0",
    "sagemaker>=2.200.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.23.0",
    "nbconvert>=7.6.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
    "pre-commit>=3.3.0",
    "sqlfluff>=3.0.0",
]

sleeper = [
    "sleeper-api-wrapper>=1.0.0",
]

yahoo = [
    "yahoo-fantasy-api>=2.0.0",
]

all = [
    "fantasy-football-2025[dev,sleeper,yahoo]",
]

[project.urls]
Homepage = "https://github.com/yourusername/fantasy-football-2025"
Repository = "https://github.com/yourusername/fantasy-football-2025"
Documentation = "https://github.com/yourusername/fantasy-football-2025#readme"
"Bug Tracker" = "https://github.com/yourusername/fantasy-football-2025/issues"

[project.scripts]
ff = "fantasy_football_2025.cli:cli"
ff-analyze = "fantasy_football_2025.main:main"
ff-optimize = "fantasy_football_2025.lineup_optimizer:main"
ff-trades = "fantasy_football_2025.trade_analyzer:main"
ff-waiver = "fantasy_football_2025.waiver_analyzer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "ipykernel>=6.23.0",
    "nbconvert>=7.6.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
    "pre-commit>=3.3.0",
    "sqlfluff>=3.0.0",
]

[tool.uv.sources]
# Use specific sources if needed for sports data packages

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["fantasy_football_2025"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=fantasy_football_2025",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "nfl_data_py.*",
    "yahoo_fantasy_api.*",
    "sleeper_api_wrapper.*",
    "plotly.*",
    "bokeh.*",
    "pulp.*",
    "cvxpy.*",
    "pymysql.*",
    "alembic.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["fantasy_football_2025"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.uv.env]
# Database Configuration
DB_HOST = "localhost"
DB_PORT = "3306"
DB_USER = "fantasy_user"
DB_PASSWORD = "fantasy_password"
DB_NAME = "fantasy_football"
DB_ECHO = "false"

# Sleeper API Configuration
SLEEPER_LEAGUE_ID = "your_league_id_here"
SLEEPER_USER_ID = "your_user_id_here"

# Weather API Configuration
WEATHER_API_KEY = "your_weather_api_key_here"
WEATHER_API_PROVIDER = "openweathermap"

# AWS Configuration
AWS_REGION = "us-east-1"
AWS_ACCOUNT_ID = "your_aws_account_id"
IMAGE_NAME = "fantasy-football-pipeline"

# Application Settings
ENVIRONMENT = "development"